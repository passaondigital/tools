# ============================================================
# Nginx vHost for horselogo.de
# Place in: /etc/nginx/sites-available/horselogo.de
# Enable: ln -s /etc/nginx/sites-available/horselogo.de /etc/nginx/sites-enabled/
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name horselogo.de www.horselogo.de pferdelogo.shop www.pferdelogo.shop;
    return 301 https://horselogo.de$request_uri;
}

# Redirect www + pferdelogo.shop → horselogo.de
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.horselogo.de pferdelogo.shop www.pferdelogo.shop;

    ssl_certificate     /etc/letsencrypt/live/horselogo.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horselogo.de/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://horselogo.de$request_uri;
}

# Main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name horselogo.de;

    ssl_certificate     /etc/letsencrypt/live/horselogo.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horselogo.de/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/horselogo/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API routes → Node.js backend (PM2)
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Stripe webhook: allow larger body
        client_max_body_size 1m;
    }

    # SPA fallback — all non-API routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
